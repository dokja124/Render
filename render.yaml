services:
  - type: web
    name: Render
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node index.js
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BOT_OWNER_ID
        sync: false
